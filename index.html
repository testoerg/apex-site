<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول · Apex</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="login-shell">
  <div class="login-visual">
    <div class="brand-row">
      <img src="assets/logo.svg" alt="Apex" style="width:38px;height:38px;">
      <div>
        <div style="font-weight:800;font-size:20px;">Apex</div>
        <div style="font-size:11px;color:#c7d0e6;">Branches Under Control</div>
      </div>
    </div>
    <h1>نظام إدارة الشركات<br>متعددة الفروع</h1>
    <p>كل فروعك، في مكان واحد. تابع المبيعات والمخزون والفرق وكل تفاصيل التشغيل من لوحة تحكم واحدة، لحظة بلحظة.</p>
  </div>
  <div class="login-form-col">
    <div class="login-form">
      <h2>مرحباً بك في Apex</h2>
      <p class="sub">قم بتسجيل الدخول للمتابعة إلى لوحة التحكم</p>
      <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="field">
          <label>البريد الإلكتروني</label>
          <input type="email" placeholder="manager@company.com" required>
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <div class="form-row-between">
          <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" style="width:auto;"> تذكرني</label>
          <a href="#">نسيت كلمة المرور؟</a>
        </div>
        <button class="btn btn-primary btn-block" type="submit">تسجيل الدخول</button>
      </form>
      <div class="divider">أو</div>
      <button class="btn btn-google btn-block" type="button" onclick="window.location.href='dashboard.html'">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 16 4 9 8.5 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.5C29.6 35.1 27 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9 39.4 16 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.2 5.7l6.5 5.5C40.9 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        تسجيل الدخول باستخدام Google
      </button>
      <div class="login-foot">© 2026 Apex — جميع الحقوق محفوظة</div>
    </div>
  </div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
